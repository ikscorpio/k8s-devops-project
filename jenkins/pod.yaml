apiVersion: v1
kind: Pod

spec:
  containers:

  - name: maven
    image: maven:3.9.9-eclipse-temurin-17
    command: ["cat"]
    tty: true

  - name: kaniko
    image: gcr.io/kaniko-project/executor:debug
    command:
      - /busybox/cat
    tty: true

  - name: kubectl
    image: bitnami/kubectl:1.30
    command:
      - sleep
    args:
      - "999999"
    tty: true
