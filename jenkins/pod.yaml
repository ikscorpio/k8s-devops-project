apiVersion: v1
kind: Pod
spec:
  containers:
  - name: maven
    image: maven:3.9.9-eclipse-temurin-17
    command: ["cat"]
    tty: true

  - name: kaniko
    image: gcr.io/kaniko-project/executor:debug
    command:
      - /busybox/cat
    tty: true

  - name: kubectl
    image: bitnami/kubectl
    command: ["cat"]
    tty: true

  volumes:
  - name: docker-sock
    hostPath:
      path: /var/run/docker.sock
