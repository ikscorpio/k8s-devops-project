apiVersion: v1
kind: PersistentVolume
metadata:
  name: nexus-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/nexus

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      securityContext:
        fsGroup: 200

      containers:
      - name: nexus
        image: sonatype/nexus3:latest

        ports:
        - containerPort: 8081

        volumeMounts:
        - name: nexus-data
          mountPath: /opt/sonatype/sonatype-work

        securityContext:
          runAsUser: 200
          runAsGroup: 200

      volumes:
      - name: nexus-data
        persistentVolumeClaim:
          claimName: nexus-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: nexus-service
spec:
  type: NodePort
  selector:
    app: nexus
  ports:
    - name: ui
      port: 8081
      targetPort: 8081
      nodePort: 30081
    - name: docker
      port: 8082
      targetPort: 8082
      nodePort: 30082
