apiVersion: v1
kind: Service
metadata:
  name: jenkins-service
  namespace: default

spec:
  type: NodePort
  selector:
    app: jenkins

  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 32256
      protocol: TCP

    - name: jnlp
      port: 50000
      targetPort: 50000
      protocol: TCP
