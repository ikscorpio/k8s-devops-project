apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-devops-app
  template:
    metadata:
      labels:
        app: k8s-devops-app
    spec:
      containers:
      - name: app
        image: IMAGE_TAG   # 👈 Jenkins will replace this
        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
